<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" font-family="Segoe UI, Arial, sans-serif">
  <title>Ingesta de documentos en RAG con Cosmos DB</title>
  <desc>Los documentos se fragmentan, el modelo de embeddings los convierte en vectores y Cosmos DB guarda texto y vector juntos. El change feed regenera el vector cuando un documento cambia.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="180" fill="#FFFFFF"/>
  <rect x="50" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="115" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Documentos</text>
  <text x="115" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">PDF, manuales</text>
  <line x1="182" y1="68" x2="198" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="265" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Fragmentar</text>
  <text x="265" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">Chunks de texto</text>
  <line x1="332" y1="68" x2="348" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="40" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="415" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Embeddings</text>
  <text x="415" y="82" text-anchor="middle" font-size="12" fill="#534AB7">Texto a vector</text>
  <line x1="482" y1="68" x2="498" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="565" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Cosmos DB</text>
  <text x="565" y="82" text-anchor="middle" font-size="12" fill="#0F6E56">Texto + vector</text>
  <path d="M565 98 L565 128 L415 128 L415 100" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="490" y="152" text-anchor="middle" font-size="12" fill="#5F5E5A">Change feed: al editar, regenera el vector</text>
</svg>
