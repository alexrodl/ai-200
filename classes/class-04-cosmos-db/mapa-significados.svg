<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="Segoe UI, Arial, sans-serif">
  <title>Mapa de significados en dos dimensiones</title>
  <desc>Perro y gato están cerca de la pregunta sobre mascotas; auto y camión están lejos.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="450" fill="#FFFFFF"/>
  <line x1="80" y1="380" x2="520" y2="380" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="380" x2="80" y2="50" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="408" text-anchor="middle" font-size="12" fill="#5F5E5A">Tiene que ver con animales</text>
  <text x="92" y="42" font-size="12" fill="#5F5E5A">Tiene que ver con vehículos</text>
  <line x1="460" y1="300" x2="440" y2="348" stroke="#1D9E75" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="460" y1="300" x2="400" y2="332" stroke="#1D9E75" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="460" y1="300" x2="120" y2="92" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="440" cy="348" r="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="454" y="356" font-size="14" fill="#2C2C2A">perro</text>
  <circle cx="400" cy="332" r="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="386" y="352" text-anchor="end" font-size="14" fill="#2C2C2A">gato</text>
  <circle cx="120" cy="92" r="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="134" y="100" font-size="14" fill="#2C2C2A">auto</text>
  <circle cx="140" cy="62" r="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="154" y="68" font-size="14" fill="#2C2C2A">camión</text>
  <circle cx="460" cy="300" r="9" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
  <text x="476" y="296" font-size="14" font-weight="600" fill="#2C2C2A">Tu pregunta</text>
  <text x="476" y="314" font-size="12" fill="#5F5E5A">"mi mascota no come"</text>
  <text x="340" y="436" text-anchor="middle" font-size="12" fill="#5F5E5A">Línea corta = significado parecido · línea larga = significado distinto</text>
</svg>
