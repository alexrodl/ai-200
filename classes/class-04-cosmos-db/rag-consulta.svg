<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif">
  <title>Consulta en RAG con Cosmos DB</title>
  <desc>La pregunta del usuario se convierte en vector, Cosmos DB recupera los fragmentos más parecidos y el LLM responde usando la pregunta más esos fragmentos.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>
  <rect x="210" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Usuario pregunta</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">"¿Cómo reseteo el router?"</text>
  <line x1="340" y1="98" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="120" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Modelo de embeddings</text>
  <text x="340" y="162" text-anchor="middle" font-size="12" fill="#534AB7">Pregunta a vector (mismo modelo)</text>
  <line x1="340" y1="178" x2="340" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="200" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Cosmos DB</text>
  <text x="340" y="242" text-anchor="middle" font-size="12" fill="#0F6E56">VectorDistance, top 5 fragmentos</text>
  <line x1="340" y1="258" x2="340" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="280" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">LLM (GPT)</text>
  <text x="340" y="322" text-anchor="middle" font-size="12" fill="#534AB7">Pregunta + 5 fragmentos</text>
  <line x1="340" y1="338" x2="340" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="360" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Respuesta</text>
  <text x="340" y="402" text-anchor="middle" font-size="12" fill="#5F5E5A">Basada en tus documentos</text>
</svg>
